server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Universal Links iOS / App Links Android ──────────────────────────────
    # Fichiers servis depuis dist/.well-known/ (Vite recopie public/.well-known
    # tel quel, dossier commençant par un point compris — vérifié).
    #
    # `^~` passe AVANT les locations regex : sans lui, tout ajout futur d'extension
    # dans la liste des assets ci-dessus pourrait détourner ces fichiers.
    # `=404` court-circuite le fallback SPA : un fichier absent doit répondre 404,
    # pas 200 + index.html, sinon Apple et Google reçoivent du HTML et l'erreur
    # devient indiagnosticable.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # apple-app-site-association n'a PAS d'extension : sans default_type, nginx le
    # sert en text/plain alors qu'Apple exige application/json. Le match exact `=`
    # est prioritaire sur le préfixe ci-dessus.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://mysugu-app-api:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://mysugu-app-api:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for real-time tracking
    location /ws/ {
        proxy_pass http://mysugu-app-api:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
